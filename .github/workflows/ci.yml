name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: denticode_ads_optimizer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d denticode_ads_optimizer_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/denticode_ads_optimizer_ci
      DENTICODE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/denticode_ads_optimizer_ci
      DENTICODE_CI_DISPOSABLE_POSTGRES: "true"
      DENTICODE_PROJECT_PHASE: pre-controlled-writes
      PIP_CACHE_DIR: ~/.cache/pip
    steps:
      - name: Check out repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=0 origin \
              "+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/pull/${{ github.event.pull_request.number }}/merge" \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            git checkout --force "refs/remotes/pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --no-tags --prune --depth=0 origin \
              "+${GITHUB_SHA}:refs/remotes/origin/current" \
              "+refs/heads/main:refs/remotes/origin/main"
            git checkout --force "${GITHUB_SHA}"
          fi

      - name: Verify Python 3.12
        run: python3.12 --version

      - name: Install dependencies
        run: python3.12 -m pip install --upgrade pip && python3.12 -m pip install -e '.[dev]'

      - name: Fail closed for unsafe PostgreSQL targets
        run: ./scripts/validate.sh PostgreSQL

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Complete pytest suite including PostgreSQL integration tests
        run: python3.12 -m pytest

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Whitespace diff check
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}...HEAD"
          else
            git diff --check "origin/main...HEAD"
          fi

      - name: Reversible migration test on disposable PostgreSQL
        run: ./scripts/validate.sh Migrations

      - name: Read-only boundary for pre-write phases
        run: ./scripts/validate.sh ReadOnly

      - name: Security gates
        run: ./scripts/validate.sh Security

      - name: Privacy and sensitive-output gates
        run: ./scripts/validate.sh Privacy

      - name: Account-isolation and project automation gates
        run: ./scripts/validate.sh Focused
