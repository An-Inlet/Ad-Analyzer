name: Inlet public page

on:
  pull_request:
    paths:
      - public/inlet/**
      - .github/workflows/inlet-public-page.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public/inlet/checks/package-lock.json
      - run: npm ci
        working-directory: public/inlet/checks
      - run: npx playwright install --with-deps chromium
        working-directory: public/inlet/checks
      - run: npm test
        working-directory: public/inlet/checks
