name: Operations Code Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production_ops_audit.py'
      - 'scripts/production_ops_audit_entrypoint.py'
      - 'scripts/bootstrap_github_operations.ps1'
      - '.github/workflows/production-operations-audit.yml'
      - '.github/workflows/operations-code-validation.yml'
      - 'docs/operations-automation.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  operations-validation:
    name: Validate operations automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.5.6'

      - name: Compile production audit
        run: |
          python -m py_compile scripts/production_ops_audit.py
          python -m py_compile scripts/production_ops_audit_entrypoint.py

      - name: Lint production audit
        run: |
          ruff check scripts/production_ops_audit.py
          ruff check scripts/production_ops_audit_entrypoint.py

      - name: Check workflow and documentation whitespace
        run: git diff --check origin/main...HEAD
