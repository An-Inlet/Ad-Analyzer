name: denticode-ads-optimizer

x-app-env: &app-env
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://denticode:replace-with-external-secret@postgres:5432/denticode_ads_optimizer?sslmode=require}
  DENTICODE_API_TOKEN: ${DENTICODE_API_TOKEN:-replace-with-external-secret}
  DENTICODE_IAP_AUDIENCE: ${DENTICODE_IAP_AUDIENCE:-}
  DENTICODE_DASHBOARD_ALLOWED_EMAILS: ${DENTICODE_DASHBOARD_ALLOWED_EMAILS:-}
  DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-require}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
  DENTICODE_REQUIRED_SECRET_NAMES: ${DENTICODE_REQUIRED_SECRET_NAMES:-DENTICODE_API_TOKEN,DATABASE_URL}
  DENTICODE_GOOGLE_ADS_WRITE_ENABLED: "false"
  DENTICODE_GOOGLE_ADS_EXECUTION_KILL_SWITCH: "true"
  DENTICODE_ALLOWED_EXECUTION_ACCOUNT_IDS: ""
  DENTICODE_ALLOWED_GOOGLE_ADS_MUTATIONS: ""
  DENTICODE_WEB_CONCURRENCY: ${DENTICODE_WEB_CONCURRENCY:-2}
  DENTICODE_WORKER_CONCURRENCY: ${DENTICODE_WORKER_CONCURRENCY:-1}
  DENTICODE_SCHEDULER_CONCURRENCY: ${DENTICODE_SCHEDULER_CONCURRENCY:-1}
  DENTICODE_WEB_TIMEOUT_SECONDS: ${DENTICODE_WEB_TIMEOUT_SECONDS:-60}
  DENTICODE_WORKER_TIMEOUT_SECONDS: ${DENTICODE_WORKER_TIMEOUT_SECONDS:-900}
  DENTICODE_SCHEDULER_TIMEOUT_SECONDS: ${DENTICODE_SCHEDULER_TIMEOUT_SECONDS:-300}
  DENTICODE_MIGRATION_TIMEOUT_SECONDS: ${DENTICODE_MIGRATION_TIMEOUT_SECONDS:-900}
  DENTICODE_GRACEFUL_SHUTDOWN_SECONDS: ${DENTICODE_GRACEFUL_SHUTDOWN_SECONDS:-30}
  DENTICODE_SYNC_INTERVAL_MINUTES: ${DENTICODE_SYNC_INTERVAL_MINUTES:-60}
  DENTICODE_SYNC_RUN_IMMEDIATELY: ${DENTICODE_SYNC_RUN_IMMEDIATELY:-false}
  DENTICODE_SYNC_MAX_ATTEMPTS: ${DENTICODE_SYNC_MAX_ATTEMPTS:-3}
  DENTICODE_SYNC_RETRY_BASE_SECONDS: ${DENTICODE_SYNC_RETRY_BASE_SECONDS:-5}
  DENTICODE_SYNC_RETRY_MAX_SECONDS: ${DENTICODE_SYNC_RETRY_MAX_SECONDS:-60}
  DENTICODE_SYNC_STALE_AFTER_MINUTES: ${DENTICODE_SYNC_STALE_AFTER_MINUTES:-180}
  DENTICODE_SYNC_ADVISORY_LOCK_KEY: ${DENTICODE_SYNC_ADVISORY_LOCK_KEY:-719042711}

x-app-base: &app-base
  build:
    context: ..
  image: denticode-ads-optimizer:${DENTICODE_IMAGE_TAG:-local}
  restart: unless-stopped
  stop_grace_period: ${DENTICODE_GRACEFUL_SHUTDOWN_SECONDS:-30}s
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy

services:
  web:
    <<: *app-base
    command: sh -c "python scripts/validate_deployment_startup.py --process web && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "${DENTICODE_HTTP_BIND:-127.0.0.1:8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app-base
    command: sh -c "python scripts/validate_deployment_startup.py --process worker && python -m app.jobs.google_ads_sync_once"
    restart: "no"

  scheduler:
    <<: *app-base
    command: sh -c "python scripts/validate_deployment_startup.py --process scheduler && python -m app.jobs.google_ads_scheduler"

  migration:
    <<: *app-base
    command: sh -c "python scripts/validate_deployment_startup.py --process migration && alembic upgrade head"
    restart: "no"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-denticode_ads_optimizer}
      POSTGRES_USER: ${POSTGRES_USER:-denticode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-external-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
