services:
  app:
    build: ..
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: production
      DENTICODE_GOOGLE_ADS_WRITE_ENABLED: "false"
      DENTICODE_GOOGLE_ADS_EXECUTION_KILL_SWITCH: "true"
    depends_on: [postgres]
  worker:
    build: ..
    command: python -m app.jobs.google_ads_scheduler
    environment:
      APP_ENV: production
      DENTICODE_GOOGLE_ADS_WRITE_ENABLED: "false"
      DENTICODE_GOOGLE_ADS_EXECUTION_KILL_SWITCH: "true"
    depends_on: [postgres]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: denticode_ads_optimizer
      POSTGRES_USER: denticode
      POSTGRES_PASSWORD: replace-with-external-secret
