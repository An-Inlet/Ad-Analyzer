name: ad-analyzer

x-app-env: &app-env
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ad_analyzer:replace-with-external-secret@postgres:5432/ad_analyzer?sslmode=require}
  AD_ANALYZER_API_TOKEN: ${AD_ANALYZER_API_TOKEN:-replace-with-external-secret}
  AD_ANALYZER_IAP_AUDIENCE: ${AD_ANALYZER_IAP_AUDIENCE:-}
  AD_ANALYZER_PLATFORM_ADMIN_EMAILS: ${AD_ANALYZER_PLATFORM_ADMIN_EMAILS:-}
  DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-require}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
  AD_ANALYZER_REQUIRED_SECRET_NAMES: ${AD_ANALYZER_REQUIRED_SECRET_NAMES:-AD_ANALYZER_API_TOKEN,DATABASE_URL}
  AD_ANALYZER_GOOGLE_ADS_WRITE_ENABLED: "false"
  AD_ANALYZER_GOOGLE_ADS_EXECUTION_KILL_SWITCH: "true"
  AD_ANALYZER_ALLOWED_EXECUTION_ACCOUNT_IDS: ""
  AD_ANALYZER_ALLOWED_GOOGLE_ADS_MUTATIONS: ""
  AD_ANALYZER_WEB_CONCURRENCY: ${AD_ANALYZER_WEB_CONCURRENCY:-2}
  AD_ANALYZER_WORKER_CONCURRENCY: ${AD_ANALYZER_WORKER_CONCURRENCY:-1}
  AD_ANALYZER_SCHEDULER_CONCURRENCY: ${AD_ANALYZER_SCHEDULER_CONCURRENCY:-1}
  AD_ANALYZER_WEB_TIMEOUT_SECONDS: ${AD_ANALYZER_WEB_TIMEOUT_SECONDS:-60}
  AD_ANALYZER_WORKER_TIMEOUT_SECONDS: ${AD_ANALYZER_WORKER_TIMEOUT_SECONDS:-900}
  AD_ANALYZER_SCHEDULER_TIMEOUT_SECONDS: ${AD_ANALYZER_SCHEDULER_TIMEOUT_SECONDS:-300}
  AD_ANALYZER_MIGRATION_TIMEOUT_SECONDS: ${AD_ANALYZER_MIGRATION_TIMEOUT_SECONDS:-900}
  AD_ANALYZER_GRACEFUL_SHUTDOWN_SECONDS: ${AD_ANALYZER_GRACEFUL_SHUTDOWN_SECONDS:-30}
  AD_ANALYZER_SYNC_INTERVAL_MINUTES: ${AD_ANALYZER_SYNC_INTERVAL_MINUTES:-60}
  AD_ANALYZER_SYNC_RUN_IMMEDIATELY: ${AD_ANALYZER_SYNC_RUN_IMMEDIATELY:-false}
  AD_ANALYZER_SYNC_MAX_ATTEMPTS: ${AD_ANALYZER_SYNC_MAX_ATTEMPTS:-3}
  AD_ANALYZER_SYNC_RETRY_BASE_SECONDS: ${AD_ANALYZER_SYNC_RETRY_BASE_SECONDS:-5}
  AD_ANALYZER_SYNC_RETRY_MAX_SECONDS: ${AD_ANALYZER_SYNC_RETRY_MAX_SECONDS:-60}
  AD_ANALYZER_SYNC_STALE_AFTER_MINUTES: ${AD_ANALYZER_SYNC_STALE_AFTER_MINUTES:-180}
  AD_ANALYZER_SYNC_ADVISORY_LOCK_KEY: ${AD_ANALYZER_SYNC_ADVISORY_LOCK_KEY:-719042711}

x-app-base: &app-base
  build:
    context: ..
  image: ad-analyzer:${AD_ANALYZER_IMAGE_TAG:-local}
  restart: unless-stopped
  stop_grace_period: ${AD_ANALYZER_GRACEFUL_SHUTDOWN_SECONDS:-30}s
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy

services:
  web:
    <<: *app-base
    command: sh -c "python scripts/validate_deployment_startup.py --process web && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "${AD_ANALYZER_HTTP_BIND:-127.0.0.1:8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app-base
    command: sh -c "python scripts/validate_deployment_startup.py --process worker && python -m app.jobs.google_ads_sync_once"
    restart: "no"

  scheduler:
    <<: *app-base
    command: sh -c "python scripts/validate_deployment_startup.py --process scheduler && python -m app.jobs.google_ads_scheduler"

  migration:
    <<: *app-base
    command: sh -c "python scripts/validate_deployment_startup.py --process migration && alembic upgrade head"
    restart: "no"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ad_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-ad_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-external-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
