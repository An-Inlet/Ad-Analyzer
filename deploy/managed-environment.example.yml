# Provider-neutral managed environment example. This is documentation, not a deployable provider spec.
# Store secret values in an external secret system or mounted secret files; keep only references here.
processes:
  web:
    command: "python scripts/validate_deployment_startup.py --process web && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers"
    concurrency_env: AD_ANALYZER_WEB_CONCURRENCY
    timeout_env: AD_ANALYZER_WEB_TIMEOUT_SECONDS
    restart: on-failure
  worker:
    command: "python scripts/validate_deployment_startup.py --process worker && python -m app.jobs.google_ads_sync_once"
    concurrency_env: AD_ANALYZER_WORKER_CONCURRENCY
    timeout_env: AD_ANALYZER_WORKER_TIMEOUT_SECONDS
    restart: no
  scheduler:
    command: "python scripts/validate_deployment_startup.py --process scheduler && python -m app.jobs.google_ads_scheduler"
    concurrency_env: AD_ANALYZER_SCHEDULER_CONCURRENCY
    timeout_env: AD_ANALYZER_SCHEDULER_TIMEOUT_SECONDS
    restart: on-failure
  migration:
    command: "python scripts/validate_deployment_startup.py --process migration && alembic upgrade head"
    concurrency: 1
    timeout_env: AD_ANALYZER_MIGRATION_TIMEOUT_SECONDS
    restart: no
environment:
  APP_ENV: production
  CLOUD_SQL_CONNECTION_NAME: "totemic-alchemy-502420-p4:us-west1:ad-analyzer-postgres"
  DATABASE_USER: "ad_analyzer_app"
  DATABASE_PASSWORD: "${EXTERNAL_SECRET_DATABASE_PASSWORD}"
  DATABASE_NAME: "ad_analyzer"
  AD_ANALYZER_API_TOKEN: "${EXTERNAL_SECRET_AD_ANALYZER_API_TOKEN}"
  AD_ANALYZER_IAP_AUDIENCE: "/projects/PROJECT_NUMBER/locations/REGION/services/SERVICE_NAME"
  AD_ANALYZER_PLATFORM_ADMIN_EMAILS: "operator@example.com"
  AD_ANALYZER_REQUIRED_SECRET_NAMES: "AD_ANALYZER_API_TOKEN,DATABASE_PASSWORD"
  AD_ANALYZER_GOOGLE_ADS_WRITE_ENABLED: "false"
  AD_ANALYZER_GOOGLE_ADS_EXECUTION_KILL_SWITCH: "true"
  AD_ANALYZER_ALLOWED_EXECUTION_ACCOUNT_IDS: ""
  AD_ANALYZER_ALLOWED_GOOGLE_ADS_MUTATIONS: ""
