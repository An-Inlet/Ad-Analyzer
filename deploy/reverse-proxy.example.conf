# Provider-neutral TLS ingress example for Nginx. Replace hostnames and certificate
# paths with externally managed values. Do not store private keys in this repo.
server {
    listen 80;
    server_name ads-optimizer.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ads-optimizer.example.com;

    ssl_certificate /etc/ssl/certs/ads-optimizer.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/ads-optimizer.key;

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8000;
    }
}
