[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ad-analyzer"
version = "0.1.0"
description = "Account-scoped advertising analysis and controlled optimization platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "An Inlet" }]
dependencies = [
    "cryptography>=44.0.0",
    "Pillow>=12.1.1,<13",
    "alembic>=1.13.2",
    "fastapi>=0.111.0",
    "firebase-admin>=7.0,<8",
    "jinja2>=3.1.4",
    "google-ads>=25.1.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-secret-manager>=2.20,<3",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.32,<2.1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "httpx2>=2.7.0",
    "mypy>=1.11.1",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.6,<0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/production_ops_audit.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
